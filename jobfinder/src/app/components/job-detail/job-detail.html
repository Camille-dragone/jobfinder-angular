<div class="flex items-start ml-5">
  <a
    routerLink="/jobs"
    class="btn bg-white/10 backdrop-blur-xl border border-white/10 shadow-xl rounded-2xl px-4 text-white"
  >
    <span class="material-symbols-outlined">arrow_back</span>
    Retour
  </a>
</div>

<div class="m-5 mx-auto mt-10 max-w-7xl">
  <div class="rounded-2xl border border-white/10 bg-white/10 p-8 text-white shadow-xl backdrop-blur-xl">

    <div class="mb-8 flex items-start gap-5">
      <div class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-white">
        <img
          *ngIf="job?.job?.company_logo"
          [src]="job.job.company_logo"
          [alt]="job.job.company"
          class="max-h-full max-w-full object-contain"
        />
        <span *ngIf="!job?.job?.company_logo" class="text-sm text-black/60">
          logo
        </span>
      </div>

      <div class="mt-3 flex flex-1 flex-col gap-4">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
          <h1 class="text-2xl font-bold">
            {{ job?.job?.title }}
          </h1>

          <p class="text-lg font-semibold text-white/80">
            {{ job?.job?.company }}
          </p>
        </div>

        <p
          *ngIf="job?.company_description"
          class="max-w-4xl leading-7 text-white/75"
        >
          {{ job?.company_description }}
        </p>

        <div
          *ngIf="job?.job?.apply_options?.length; else noLinks"
          class="mt-2 flex flex-wrap gap-4"
        >
          <a
            *ngFor="let option of job.job.apply_options"
            [href]="option.link"
            target="_blank"
            rel="noopener noreferrer"
            class="btn rounded-2xl border border-white/10 bg-white/10 px-4 text-white shadow-xl backdrop-blur-xl"
          >
            {{ option.title }}
          </a>
        </div>

        <ng-template #noLinks>
          <p class="mt-2 text-white/60">Aucun lien de candidature disponible.</p>
        </ng-template>
      </div>
    </div>

    <div class="mt-12 grid grid-cols-1 gap-6 lg:grid-cols-2">
      <div class="card rounded-2xl border border-white/10 bg-white/10 px-4 text-white shadow-xl backdrop-blur-xl">
        <div class="card-body">
            <h2 class="text-xl font-bold">
            Description
            </h2>
          <markdown
            [data]="job?.job?.description"
            class="max-w-none self-start text-white
                   [&_h1]:mb-4 [&_h1]:mt-8 [&_h1]:text-2xl [&_h1]:font-bold
                   [&_h2]:mb-4 [&_h2]:mt-8 [&_h2]:text-xl [&_h2]:font-bold
                   [&_h3]:mb-4 [&_h3]:mt-8 [&_h3]:text-lg [&_h3]:font-bold
                   [&_h4]:mb-3 [&_h4]:mt-6 [&_h4]:text-base [&_h4]:font-bold
                   [&_p]:mb-4 [&_p]:leading-relaxed [&_p]:text-white/90
                   [&_ul]:mb-6 [&_ul]:list-disc [&_ul]:pl-6
                   [&_li]:mb-2 [&_li]:leading-relaxed [&_li]:text-white/90">
          </markdown>
        </div>
      </div>

      <div class="card rounded-2xl border border-white/10 bg-white/10 px-4 text-white shadow-xl backdrop-blur-xl">
        <div class="card-body gap-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold">Lettre de motivation proposée</h2>
            <span class="card rounded-2xl border border-white/10 bg-white/10 px-4 text-white shadow-xl backdrop-blur-xl">
              {{ job?.skills_percent }}% 
            </span>
          </div>
          <div
            class="whitespace-pre-line rounded-2xl border border-white/10 bg-black/20 p-5 leading-7 text-white/90"
          >
            {{ job?.motivation_letter }}
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
